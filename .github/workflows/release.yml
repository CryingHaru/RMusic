name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.RMUSIC_KEYSTORE }}" | base64 -d > rmusic-release-key.keystore

      - name: Build release APK
        env:
          RMUSIC_KEYSTORE: ${{ github.workspace }}/rmusic-release-key.keystore
          RMUSIC_KEYSTORE_PASSWORD: ${{ secrets.RMUSIC_KEYSTORE_PASSWORD }}
          RMUSIC_KEY_ALIAS: ${{ secrets.RMUSIC_KEY_ALIAS }}
          RMUSIC_KEY_PASSWORD: ${{ secrets.RMUSIC_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: RMusic ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
